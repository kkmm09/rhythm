<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>海賊お宝キャッチ！</title>
    <style>
        /* 文化祭・Scratch風の手作り感のあるデザイン */
        @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');

        body {
            font-family: 'Kosugi Maru', 'MS PGothic', sans-serif;
            background-color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        #game-wrapper {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            background-color: #fff;
            border: 8px solid #000;
            border-radius: 8px;
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* オーバーレイUI群 */
        .ui-layer {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .hidden {
            display: none !important;
        }

        /* 手作り感のあるボタン */
        .btn {
            font-family: inherit;
            background-color: #4ade80;
            border: 6px solid #000;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 24px;
            font-weight: bold;
            color: #000;
            cursor: pointer;
            box-shadow: 6px 6px 0 #000;
            margin: 10px;
            transition: transform 0.1s;
        }
        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #000;
        }
        .btn:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        .btn-blue { background-color: #38bdf8; }
        .btn-red { background-color: #fb7185; }

        /* ゲーム中の「やめる」ボタン */
        #quit-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #06b6d4;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 4px 4px 0 #000;
            cursor: pointer;
            z-index: 20;
        }
        #quit-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #000;
        }

        /* スコア・タイム表示 */
        #info-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 15px;
            z-index: 5;
            pointer-events: none;
        }
        
        .info-box {
            background-color: #fff;
            border: 4px solid #000;
            border-radius: 8px;
            padding: 5px 15px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 4px 4px 0 #000;
        }

        /* タイトル・リザルト */
        h1 {
            font-size: 48px;
            color: #fde047;
            text-shadow: -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000, 4px 4px 0 #000;
            margin-bottom: 30px;
            text-align: center;
        }
        .result-text {
            font-size: 40px;
            color: #fff;
            text-shadow: -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000;
            margin-bottom: 20px;
            text-align: center;
        }

        /* やめる確認モーダル */
        #modal-quit-box {
            background-color: #fff;
            border: 6px solid #000;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            box-shadow: 8px 8px 0 #000;
        }
        #modal-quit-box h2 {
            margin-top: 0;
            font-size: 30px;
        }
    </style>
</head>
<body>
<div id="game-wrapper">
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <!-- 情報バー -->
    <div id="info-bar" class="hidden">
        <div class="info-box" id="ui-score">G 0</div>
        <div class="info-box" id="ui-time">30秒</div>
    </div>

    <!-- やめるボタン -->
    <button id="quit-btn" class="hidden" onclick="onQuitClicked()">やめる</button>

    <!-- ホーム画面 -->
    <div id="screen-home" class="ui-layer">
        <h1>海賊お宝キャッチ！</h1>
        <!-- 【解説】音源読み込み完了までボタンを押せないように disabled を追加し、idを付与しました -->
        <button id="btn-tutorial" class="btn btn-blue" onclick="startTutorial()" disabled>れんしゅう（チュートリアル）</button>
        <button id="btn-start" class="btn" onclick="startGame()" disabled>本番スタート！（30秒）</button>
        <!-- 【解説】音源読み込み中であることを伝えるテキストを追加しました -->
        <div id="loading-text" style="color: #fde047; font-size: 20px; margin-top: 20px; font-weight: bold;">♪ 音源データを読み込み中...</div>
    </div>

    <!-- リザルト画面 -->
    <div id="screen-result" class="ui-layer hidden">
        <div class="result-text" id="result-rank">海賊王！</div>
        <div class="result-text" style="font-size: 24px;" id="result-score">スコア: 0</div>
        <button class="btn" onclick="showHome()">終了（ホームへ戻る）</button>
    </div>

    <!-- やめる確認モーダル -->
    <div id="modal-quit" class="ui-layer hidden" style="z-index: 30;">
        <div id="modal-quit-box">
            <h2>ほんとうにやめる？</h2>
            <div>
                <button class="btn" onclick="resumeGame()">続ける</button>
                <button class="btn btn-red" onclick="showHome()">やめる</button>
            </div>
        </div>
    </div>
</div>

<script>
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;

// 【解説】HTML5 Audio要素を使用してCORS制限を回避して再生するための変数を追加
let bgmAudio = new Audio();
let isBgmLoaded = false;

// 【解説】GitHub/Render等に配置した「bgm.mp3」を直接読み込む関数
function loadBGM() {
    const bgmFileName = 'bgm.mp3';
    console.log(`[Audio Log] 音源「${bgmFileName}」の読み込み処理を開始します...`);
    
    // index.html と同じフォルダに置いたファイルパスを指定
    bgmAudio.src = bgmFileName;
    bgmAudio.preload = 'auto';

    // 音源データの読み込み完了（再生可能）イベント
    bgmAudio.addEventListener('canplaythrough', () => {
        if (!isBgmLoaded) {
            isBgmLoaded = true;
            console.log(`[Audio Log] 音源ファイル「${bgmFileName}」の読み込みが完了し、再生準備が整いました。`);
            
            // ボタンを有効化し、ローディング表示を非表示にする
            document.getElementById('btn-tutorial').disabled = false;
            document.getElementById('btn-start').disabled = false;
            document.getElementById('loading-text').classList.add('hidden');
            console.log("[UI Log] BGM準備完了に伴い、スタートボタンを有効化してローディング表示を非表示にしました。");
        }
    });

    // 音源ファイルの読み込みエラーイベント
    bgmAudio.addEventListener('error', (e) => {
        console.error(`[Audio Error] 音源ファイル「${bgmFileName}」の読み込みに失敗しました。index.htmlと同じ階層に同名ファイルがアップロードされているか確認してください。`, e);
        document.getElementById('loading-text').innerText = "音源の読み込みに失敗しました（「bgm.mp3」の配置を確認してください）";
        document.getElementById('btn-tutorial').disabled = false;
        document.getElementById('btn-start').disabled = false;
    });

    // 読み込み実行
    bgmAudio.load();
}
// スクリプト読み込み時にすぐ実行
loadBGM();

// --- リズム設定 ---
// 【解説】1分(60秒)をBPM(115)で割ることで、1拍あたりの秒数を計算しています。
const SEC_PER_BEAT = 60 / 115; // 115BPM (ズンチャの1拍分)
console.log(`[Config Log] BPM設定を115に変更しました。1拍あたりの秒数(SEC_PER_BEAT): ${SEC_PER_BEAT.toFixed(4)}秒`);

const CUE_OFFSET = 0.05;  // 人間の反射神経に合わせる微調整
console.log(`[Config Log] CUE_OFFSET (予兆音のズレ設定): ${CUE_OFFSET}秒`);

// 【解説】MP3音源の最初の「ズン」が鳴るまでの無音時間を調整するオフセット値です。
// 基本は0.0秒でピッタリ合うようにしていますが、もしプレイしてズレを感じる場合は、ここの数値を 0.1 や -0.05 などにして微調整できます。
const BGM_OFFSET = 0.0; 
console.log(`[Config Log] BGM_OFFSET (MP3開始のズレ調整): ${BGM_OFFSET}秒`);

let startTime = 0;
let nextScheduleBeat = 0;
let isPaused = false; 

// --- ゲーム状態 ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'HOME'; // HOME, PLAYING, TUTORIAL, RESULT
let score = 0;
let activeNotes = [];
let particles = [];
let pirateState = 'IDLE'; // IDLE, CATCH
let pirateAnimTimer = 0;
let currentMessage = "";
let stageSequence = [];

// Google Driveからの背景画像読み込み設定
const bgImage = new Image();
let bgImageLoaded = false;
bgImage.crossOrigin = "anonymous";
// Google DriveのファイルIDを直接画像URLに変換
bgImage.src = 'https://lh3.googleusercontent.com/d/1DEQQjEgnglPDn3a6_02rDTuE-hRCj8Jh';
bgImage.onload = () => {
    bgImageLoaded = true;
};
bgImage.onerror = () => {
    // 読み込み失敗時の代替配信URLフォーマット
    if (bgImage.src !== 'https://drive.google.com/uc?export=view&id=1DEQQjEgnglPDn3a6_02rDTuE-hRCj8Jh') {
        bgImage.src = 'https://drive.google.com/uc?export=view&id=1DEQQjEgnglPDn3a6_02rDTuE-hRCj8Jh';
    }
};

// 海賊の通常画像
const pirateIdleImg = new Image();
let pirateIdleImgLoaded = false;
pirateIdleImg.crossOrigin = "anonymous";
pirateIdleImg.src = 'https://lh3.googleusercontent.com/d/1RTmdlC83KDMQbAXd64WHPNO03TiOu_ZL';
pirateIdleImg.onload = () => { pirateIdleImgLoaded = true; };
pirateIdleImg.onerror = () => {
    if (pirateIdleImg.src !== 'https://drive.google.com/uc?export=view&id=1RTmdlC83KDMQbAXd64WHPNO03TiOu_ZL') {
        pirateIdleImg.src = 'https://drive.google.com/uc?export=view&id=1RTmdlC83KDMQbAXd64WHPNO03TiOu_ZL';
    }
};

// 海賊のアクション画像（エンターキー押下）
const pirateActionImg = new Image();
let pirateActionImgLoaded = false;
pirateActionImg.crossOrigin = "anonymous";
pirateActionImg.src = 'https://lh3.googleusercontent.com/d/10E2MlRJAOqt-RC_muFBqlb7eUws-v86x';
pirateActionImg.onload = () => { pirateActionImgLoaded = true; };
pirateActionImg.onerror = () => {
    if (pirateActionImg.src !== 'https://drive.google.com/uc?export=view&id=10E2MlRJAOqt-RC_muFBqlb7eUws-v86x') {
        pirateActionImg.src = 'https://drive.google.com/uc?export=view&id=10E2MlRJAOqt-RC_muFBqlb7eUws-v86x';
    }
};

// --- サウンドエンジン ---
function playTone(freq1, freq2, type, duration, vol = 0.5, time = null) {
    if (!audioCtx || audioCtx.state === 'suspended') return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    
    let t = time !== null ? time : audioCtx.currentTime;
    if (t < audioCtx.currentTime) t = audioCtx.currentTime;
    
    osc.frequency.setValueAtTime(freq1, t);
    if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, t + duration);
    
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
}

const Sounds = {
    cueCoin: (t) => playTone(300, 600, 'square', 0.15, 0.3, t),
    cueGem: (t) => playTone(800, 1200, 'triangle', 0.1, 0.3, t),
    cueSkull: (t) => playTone(180, 120, 'sawtooth', 0.25, 0.4, t),
    hitCoin: () => playTone(1000, 1500, 'sine', 0.1, 0.6),
    hitGem: () => playTone(1500, 2500, 'sine', 0.1, 0.6),
    miss: () => playTone(200, 150, 'sawtooth', 0.2, 0.3),
    
    // 【解説】バックグラウンドのリズム音「ズン」の処理（現在はMP3音源再生のため呼ばれません）
    // 音量(第5引数)を 0.15 から 0.4 に大きくしました。
    beatZun: (t) => {
        console.log(`[Sound Log] beatZun(ズン) を再生予定時間 ${t.toFixed(2)}秒 にスケジュールしました。音量: 0.4`);
        playTone(150, 100, 'sine', 0.1, 0.4, t);
    },
    
    // 【解説】バックグラウンドのリズム音「チャ」の処理（現在はMP3音源再生のため呼ばれません）
    // 音量(第5引数)を 0.05 から 0.2 に大きくしました。
    beatCha: (t) => {
        console.log(`[Sound Log] beatCha(チャ) を再生予定時間 ${t.toFixed(2)}秒 にスケジュールしました。音量: 0.2`);
        playTone(400, 300, 'square', 0.05, 0.2, t);
    }
};

// --- シーケンス生成 ---
function generateSequence(mode) {
    let seq = [];
    let currentBeat = 2; // 最初のズンのタイミング

    if (mode === 'TUTORIAL') {
        seq.push({ beat: 2, type: 'COIN' });   
        seq.push({ beat: 4, type: 'COIN' });  
        seq.push({ beat: 6, type: 'COIN' });  
        
        // 宝石連続コンボ (1で予兆、2でコイン、3で宝石、4でコイン)
        seq.push({ beat: 10, type: 'COIN' });  
        seq.push({ beat: 11, type: 'GEM' }); 
        seq.push({ beat: 12, type: 'COIN' }); 
        
        seq.push({ beat: 18, type: 'SKULL' });  
        seq.push({ beat: 20, type: 'COIN' });   
    } 
    else if (mode === 'PLAYING') {
        while(currentBeat < 56) {
            let r = Math.random();
            if (r < 0.15) {
                // ドクロ
                seq.push({ beat: currentBeat, type: 'SKULL' });
                currentBeat += 2;
            } else if (r < 0.45 && currentBeat < 50) {
                // 宝石パターン (1:予兆, 2:COIN, 3:GEM, 4:COIN)
                seq.push({ beat: currentBeat, type: 'COIN' });
                seq.push({ beat: currentBeat + 1, type: 'GEM' });
                seq.push({ beat: currentBeat + 2, type: 'COIN' });
                currentBeat += 4; // 4拍分進める
            } else {
                // コイン
                seq.push({ beat: currentBeat, type: 'COIN' });
                currentBeat += 2; // 次の「ズン」へ
            }
        }
    }
    return seq;
}

function drawTreasureCaveBackground() {
    // 洞窟奥の星空
    let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height * 0.6);
    skyGrad.addColorStop(0, '#050b18');
    skyGrad.addColorStop(0.5, '#111827');
    skyGrad.addColorStop(1, '#1e1b4b');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // きらめく星
    ctx.fillStyle = '#ffffff';
    const stars = [[120, 30], [200, 50], [280, 20], [350, 45], [420, 25], [500, 60], [160, 70], [460, 80]];
    for (let s of stars) {
        ctx.beginPath();
        ctx.arc(s[0], s[1], Math.sin(Date.now() * 0.003 + s[0]) * 0.8 + 1.2, 0, Math.PI * 2);
        ctx.fill();
    }

    // 遠くの山々
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.moveTo(80, canvas.height * 0.55);
    ctx.lineTo(180, canvas.height * 0.2);
    ctx.lineTo(260, canvas.height * 0.45);
    ctx.lineTo(360, canvas.height * 0.15);
    ctx.lineTo(450, canvas.height * 0.4);
    ctx.lineTo(540, canvas.height * 0.22);
    ctx.lineTo(600, canvas.height * 0.55);
    ctx.closePath();
    ctx.fill();

    // 山の雪景色ハイライト
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath();
    ctx.moveTo(180, canvas.height * 0.2); ctx.lineTo(165, canvas.height * 0.28); ctx.lineTo(195, canvas.height * 0.28); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(360, canvas.height * 0.15); ctx.lineTo(340, canvas.height * 0.25); ctx.lineTo(380, canvas.height * 0.25); ctx.fill();

    // 洞窟の枠・鍾乳石
    ctx.fillStyle = '#1c1917';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(canvas.width, 0); ctx.lineTo(canvas.width, 40);
    ctx.lineTo(560, 80); ctx.lineTo(480, 40); ctx.lineTo(400, 75);
    ctx.lineTo(320, 30); ctx.lineTo(240, 85); ctx.lineTo(160, 45);
    ctx.lineTo(80, 90); ctx.lineTo(0, 50);
    ctx.closePath(); ctx.fill();

    // 左右の岩柱
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(80, 0); ctx.lineTo(50, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width - 80, 0); ctx.lineTo(canvas.width - 50, canvas.height); ctx.lineTo(canvas.width, canvas.height); ctx.fill();

    // 宝の山（背景層）
    ctx.fillStyle = '#b45309';
    ctx.beginPath();
    ctx.ellipse(canvas.width * 0.3, canvas.height * 0.8, 240, 110, 0, 0, Math.PI * 2);
    ctx.ellipse(canvas.width * 0.7, canvas.height * 0.8, 240, 110, 0, 0, Math.PI * 2);
    ctx.fill();

    // 黄金の山（手前層）
    let goldGrad = ctx.createLinearGradient(0, canvas.height * 0.65, 0, canvas.height);
    goldGrad.addColorStop(0, '#facc15');
    goldGrad.addColorStop(0.5, '#eab308');
    goldGrad.addColorStop(1, '#a16207');
    ctx.fillStyle = goldGrad;
    ctx.beginPath();
    ctx.ellipse(canvas.width * 0.5, canvas.height * 0.9, 380, 150, 0, 0, Math.PI * 2);
    ctx.fill();

    // 宝箱（アクセント）
    ctx.fillStyle = '#78350f';
    ctx.fillRect(canvas.width * 0.5 - 35, canvas.height * 0.7, 70, 40);
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3;
    ctx.strokeRect(canvas.width * 0.5 - 35, canvas.height * 0.7, 70, 40);
    ctx.fillStyle = '#fef08a';
    ctx.beginPath(); ctx.arc(canvas.width * 0.5, canvas.height * 0.7 + 20, 6, 0, Math.PI * 2); ctx.fill();

    // コインと宝石のキラキラ散らばり
    const dots = [
        {x: 120, y: 390, c: '#fde047', r: 6}, {x: 160, y: 420, c: '#ef4444', r: 5},
        {x: 210, y: 400, c: '#3b82f6', r: 6}, {x: 250, y: 440, c: '#fde047', r: 7},
        {x: 480, y: 410, c: '#10b981', r: 6}, {x: 520, y: 390, c: '#fde047', r: 8},
        {x: 550, y: 430, c: '#ef4444', r: 5}, {x: 320, y: 450, c: '#fde047', r: 6}
    ];
    for (let d of dots) {
        ctx.fillStyle = d.c;
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
    }
}

function draw() {
    // 指定画像が読み込めた場合は画像を表示、読み込み前・失敗時はキャンバス描画をフォールバック表示
    if (bgImageLoaded) {
        ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);
    } else {
        drawTreasureCaveBackground();
    }

    // 吹き出し（中央上に配置）
    if (currentMessage !== "") {
        ctx.fillStyle = '#06b6d4';
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        
        ctx.beginPath();
        ctx.roundRect(160, 80, 320, 110, 10); 
        ctx.fill();
        ctx.stroke();
        
        // 尻尾（右下のキャラクターに向ける）
        ctx.beginPath();
        ctx.moveTo(380, 190);
        ctx.lineTo(400, 230);
        ctx.lineTo(420, 190);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#000';
        ctx.font = 'bold 20px "MS PGothic", sans-serif';
        ctx.textAlign = 'center';
        let lines = currentMessage.split('\n');
        for (let i = 0; i < lines.length; i++) {
            ctx.fillText(lines[i], 320, 115 + (i * 30)); 
        }
    }

    // キャラクター（右側に配置）
    const charX = canvas.width - 140; // X座標を右側に
    const charY = 320;
    
    // お宝をキャッチする位置
    const catchTargetX = canvas.width / 2 + 30;
    const catchTargetY = charY + 20;

    let currentTime = audioCtx ? audioCtx.currentTime : 0;
    let isAction = (pirateState === 'CATCH' && currentTime < pirateAnimTimer);

    // キャラクター画像の描画
    if (isAction && pirateActionImgLoaded) {
        ctx.drawImage(pirateActionImg, charX - 100, charY - 140, 200, 250);
    } else if (!isAction && pirateIdleImgLoaded) {
        ctx.drawImage(pirateIdleImg, charX - 100, charY - 140, 200, 250);
    } else {
        // 画像読み込み前のフォールバック（左向き）
        ctx.lineWidth = 4;
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(charX - 25, charY, 50, 80);
        ctx.strokeRect(charX - 25, charY, 50, 80);
        ctx.fillStyle = '#000';
        ctx.fillRect(charX - 20, charY + 80, 12, 40);
        ctx.fillRect(charX + 8, charY + 80, 12, 40);
        ctx.fillStyle = '#fca5a5';
        ctx.beginPath(); ctx.arc(charX, charY - 30, 35, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(charX - 10, charY - 35, 12, 0, Math.PI); ctx.fill(); // 眼帯左側
        ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(charX + 30, charY - 45); ctx.lineTo(charX - 30, charY - 25); ctx.stroke();
        
        ctx.lineWidth = 15;
        ctx.lineCap = 'round';
        if (isAction) {
            ctx.strokeStyle = '#fca5a5';
            ctx.beginPath(); ctx.moveTo(charX - 10, charY + 20); ctx.lineTo(catchTargetX + 20, catchTargetY); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(catchTargetX + 20, catchTargetY, 20, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        } else {
            ctx.strokeStyle = '#fca5a5';
            ctx.beginPath(); ctx.moveTo(charX - 10, charY + 20); ctx.lineTo(charX - 20, charY + 60); ctx.stroke();
        }
        ctx.lineWidth = 4;
    }

    // ノーツ描画（放物線軌道・左から右へ）
    for (let i = 0; i < activeNotes.length; i++) {
        let note = activeNotes[i];
        if (note.hit) continue;

        let progress = (currentTime - note.spawnTime) / (note.targetTime - note.spawnTime);
        
        if (progress >= 0 && progress <= 1.5) {
            let startX = -50; // 画面の左外側から
            let startY = catchTargetY + 60; // 少し下から出る
            
            // 放物線の計算
            let currentX = startX + (catchTargetX - startX) * progress;
            let currentY = startY + (catchTargetY - startY) * progress - Math.sin(progress * Math.PI) * 180;

            ctx.save();
            ctx.translate(currentX, currentY);
            ctx.rotate(progress * Math.PI * 4); // 回転
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#000';
            
            if (note.type === 'COIN') {
                ctx.fillStyle = '#fde047';
                ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#000'; ctx.font = 'bold 24px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('$', 0, 2);
            } else if (note.type === 'GEM') {
                ctx.fillStyle = '#38bdf8';
                ctx.beginPath(); ctx.moveTo(0, -25); ctx.lineTo(25, 0); ctx.lineTo(0, 25); ctx.lineTo(-25, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
            } else if (note.type === 'SKULL') {
                ctx.fillStyle = '#1e293b';
                ctx.beginPath(); ctx.arc(0, 0, 25, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('☠️', 0, 0);
            }
            ctx.restore();
        }
    }

    // パーティクル描画
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life -= 1;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function update() {
    if (!audioCtx || (gameState !== 'PLAYING' && gameState !== 'TUTORIAL') || isPaused) {
        requestAnimationFrame(update);
        return;
    }

    let currentTime = audioCtx.currentTime;

    // チュートリアルのメッセージ変更
    if (gameState === 'TUTORIAL') {
        let currentBeatNum = Math.floor((currentTime - startTime) / SEC_PER_BEAT);
        if (currentBeatNum < 8) currentMessage = "「ズン」で出た宝を\n「チャ」のリズムで\n【Enter】キャッチだ！";
        else if (currentBeatNum < 16) currentMessage = "宝石は連続コンボ！\nタン・タン・タンのリズムで\nコイン・宝石・コインと取れ！";
        else if (currentBeatNum < 24) currentMessage = "【ドクロ☠️】は罠だ！\n【Enter】を押さずに\nスルーしよう！";
        else {
            startTime = currentTime + 1;
            nextScheduleBeat = 0;
            activeNotes = [];
            stageSequence = generateSequence('TUTORIAL');
        }
    }

    // ノーツのスケジュール生成
    while (startTime + (nextScheduleBeat * SEC_PER_BEAT) < currentTime + 0.5) {
        let currentBeatIndex = nextScheduleBeat;
        let beatTime = startTime + (currentBeatIndex * SEC_PER_BEAT);
        
        // ズンチャのバックトラックリズム音
        // 【解説】MP3の音源ファイルを使用するため、プログラム生成のズンチャ音を停止（コメントアウト）しました。
        // if (currentBeatIndex % 2 === 0) Sounds.beatZun(beatTime);
        // else Sounds.beatCha(beatTime);

        // この1拍の間に生成されるノーツを探す（小数beat対応）
        let notesInThisBeat = stageSequence.filter(n => n.beat >= currentBeatIndex && n.beat < currentBeatIndex + 1);
        
        for (let noteData of notesInThisBeat) {
            let noteSpawnTime = startTime + (noteData.beat * SEC_PER_BEAT);
            // コインも宝石もすべて1拍で到達する
            let travelTime = SEC_PER_BEAT * 1.0;
            let targetTime = noteSpawnTime + travelTime;
            
            activeNotes.push({
                type: noteData.type,
                spawnTime: noteSpawnTime,
                targetTime: targetTime,
                hit: false,
                missed: false
            });

            let cueTime = noteSpawnTime - CUE_OFFSET;
            if (noteData.type === 'COIN') Sounds.cueCoin(cueTime);
            else if (noteData.type === 'GEM') Sounds.cueGem(cueTime);
            else if (noteData.type === 'SKULL') Sounds.cueSkull(cueTime);
        }
        nextScheduleBeat++;
    }

    // 見逃し判定
    for (let i = 0; i < activeNotes.length; i++) {
        let note = activeNotes[i];
        let progress = (currentTime - note.spawnTime) / (note.targetTime - note.spawnTime);
        if (progress > 1.15 && !note.hit && !note.missed) {
            note.missed = true;
            if (note.type === 'SKULL') {
                // ドクロを回避成功！
                createParticles(canvas.width / 2 + 30, 340, '#4ade80', 8);
            } else {
                // 宝を取り逃がした（減点のみ！）
                Sounds.miss();
                score = Math.max(0, score - 300);
                document.getElementById('ui-score').innerText = `G ${score}`;
            }
        }
    }

    // 本番終了判定
    if (gameState === 'PLAYING') {
        let elapsed = currentTime - startTime;
        let remaining = Math.max(0, 30 - elapsed);
        document.getElementById('ui-time').innerText = Math.ceil(remaining) + '秒';
        
        if (remaining <= 0) {
            endGame(); // タイムアップクリア
            requestAnimationFrame(update);
            return;
        }
    }

    // 過ぎ去ったノーツを削除
    activeNotes = activeNotes.filter(n => {
        let progress = (currentTime - n.spawnTime) / (n.targetTime - n.spawnTime);
        return progress < 1.5;
    });

    draw();
    requestAnimationFrame(update);
}

// アクション処理
function handleInput() {
    if ((gameState !== 'PLAYING' && gameState !== 'TUTORIAL') || isPaused) return;
    
    let currentTime = audioCtx.currentTime;
    
    // アニメーション設定
    pirateState = 'CATCH';
    pirateAnimTimer = currentTime + 0.15;

    let targetNote = null;
    let minDiff = Infinity;
    
    for (let note of activeNotes) {
        if (note.hit || note.missed) continue;
        let diff = Math.abs(currentTime - note.targetTime);
        if (diff < minDiff) {
            minDiff = diff;
            targetNote = note;
        }
    }

    const HIT_WINDOW = 0.15;
    const catchTargetX = canvas.width / 2 + 30; // 右側に修正
    const catchTargetY = 340;

    if (targetNote && minDiff <= HIT_WINDOW) {
        targetNote.hit = true;
        
        // 宝をキャッチ成功！
        if (targetNote.type === 'COIN') {
            Sounds.hitCoin();
            score += 500;
            createParticles(catchTargetX, catchTargetY, '#fde047', 15);
        } else if (targetNote.type === 'GEM') {
            Sounds.hitGem();
            score += 1000;
            createParticles(catchTargetX, catchTargetY, '#38bdf8', 20);
        } else if (targetNote.type === 'SKULL') {
            // ドクロを誤って叩いちゃった（ペナルティ）
            Sounds.miss();
            score = Math.max(0, score - 500);
            createParticles(catchTargetX, catchTargetY, '#ef4444', 20);
        }
    } else {
        // 何もないところで振った（空振りペナルティ）
        Sounds.miss();
        score = Math.max(0, score - 100);
        createParticles(catchTargetX, catchTargetY, '#94a3b8', 10); 
    }
    
    document.getElementById('ui-score').innerText = `G ${score}`;
}

function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 15,
            vy: (Math.random() - 0.5) * 15 - 5,
            life: Math.random() * 20 + 10,
            size: Math.random() * 6 + 4,
            color: color
        });
    }
}

function initAudio() {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

// 【解説】読み込んだMP3音源（bgmAudio）を先頭から再生する関数
function playBGM() {
    if (!isBgmLoaded) {
        console.log("[Audio Log] BGMの読み込みが完了していないため、再生をスキップしました。");
        return;
    }
    console.log("[Audio Log] MP3音源（HTML5 Audio）の再生を開始します。");
    bgmAudio.currentTime = 0; // 曲の先頭に巻き戻し
    bgmAudio.play().then(() => {
        console.log("[Audio Log] BGMの再生を開始しました。");
    }).catch(error => {
        console.error("[Audio Error] BGMの自動再生に失敗しました:", error);
    });
}

function resetGame() {
    initAudio();
    isPaused = false;
    score = 0;
    activeNotes = [];
    particles = [];
    nextScheduleBeat = 0;
    
    // 【解説】BGMを再生し、ノーツの発生基準時間(startTime)を BGM再生開始時間 + BGM_OFFSET に完全同期させます。
    playBGM();
    startTime = audioCtx.currentTime + BGM_OFFSET; 
    console.log(`[Game Log] ゲームリセット。ノーツスケジュール開始時間を ${startTime.toFixed(2)} に同期しました。`);
    
    document.getElementById('ui-score').innerText = 'G 0';
    document.getElementById('game-wrapper').style.borderColor = '#000';
    
    document.getElementById('screen-home').classList.add('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('info-bar').classList.remove('hidden');
    document.getElementById('modal-quit').classList.add('hidden');
}

function startTutorial() {
    resetGame();
    gameState = 'TUTORIAL';
    currentMessage = "宝（コインや宝石）は\n【Enterキー】を押して\nキャッチだ！";
    document.getElementById('ui-time').innerText = '∞';
    document.getElementById('quit-btn').classList.remove('hidden');
    stageSequence = generateSequence('TUTORIAL');
}

function startGame() {
    resetGame();
    gameState = 'PLAYING';
    currentMessage = "";
    document.getElementById('quit-btn').classList.remove('hidden');
    document.getElementById('ui-time').innerText = '30秒';
    stageSequence = generateSequence('PLAYING');
}

function onQuitClicked() {
    isPaused = true;
    if (audioCtx) audioCtx.suspend(); 
    if (bgmAudio) bgmAudio.pause(); // BGMも一時停止
    document.getElementById('modal-quit').classList.remove('hidden');
}

function resumeGame() {
    isPaused = false;
    if (audioCtx) audioCtx.resume(); 
    if (bgmAudio) bgmAudio.play(); // BGM再開
    document.getElementById('modal-quit').classList.add('hidden');
}

function endGame() {
    gameState = 'RESULT';
    document.getElementById('info-bar').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');
    document.getElementById('quit-btn').classList.add('hidden');
    
    document.getElementById('result-score').innerText = `獲得スコア: ${score} G`;
    let rankText = "見習い海賊";
    if (score > 10000) rankText = "伝説の海賊王！";
    else if (score > 5000) rankText = "大海賊クラス！";
    document.getElementById('result-rank').innerText = rankText;
}

function showHome() {
    gameState = 'HOME';
    isPaused = false;
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    
    // 【解説】ホーム画面に戻ったタイミングで、再生中のBGMを停止・初期化します
    if (bgmAudio) {
        bgmAudio.pause();
        bgmAudio.currentTime = 0;
        console.log("[Audio Log] ホーム画面に戻ったため、BGMの再生を停止・リセットしました。");
    }
    
    document.getElementById('screen-home').classList.remove('hidden');
    document.getElementById('screen-result').classList.add('hidden');
    document.getElementById('info-bar').classList.add('hidden');
    document.getElementById('quit-btn').classList.add('hidden');
    document.getElementById('modal-quit').classList.add('hidden');
    currentMessage = "";
    draw();
}

// --- イベントリスナー ---
window.addEventListener('keydown', (e) => {
    if (e.code === 'Enter') {
        e.preventDefault();
        handleInput();
    }
});

showHome();
requestAnimationFrame(update);
</script>
